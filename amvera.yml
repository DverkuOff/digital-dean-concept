# Amvera: сборка по Dockerfile. Переменные окружения (секреты) задаются в личном кабинете:
# DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL (см. .env.example и README).
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest
build:
  dockerfile: Dockerfile
  skip: false
run:
  containerPort: 3000
